name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest's default Java is now v25, which Kotlin 2.0.21 (and our
      # Gradle build) cannot parse. Force JDK 17/21 for the build.
      - name: Select JDK 17 or 21
        run: |
          set -e
          found=""
          for jdk in temurin-21-jdk-amd64 temurin-17-jdk-amd64 java-21-openjdk-amd64 java-17-openjdk-amd64; do
            if [ -d "/usr/lib/jvm/$jdk" ]; then
              found="$jdk"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "No JDK 17/21 found; /usr/lib/jvm contents:"
            ls /usr/lib/jvm/
            exit 1
          fi
          echo "Using $found"
          echo "JAVA_HOME=/usr/lib/jvm/$found" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/$found/bin" >> "$GITHUB_PATH"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Ensure Android SDK platform 35
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "android-35 already installed"
          else
            echo "android-35 missing; installing via sdkmanager"
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-35"
          fi

      - name: Build APK (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: virality-clipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
