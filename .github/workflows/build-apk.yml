name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest's default Java is now v25, which Kotlin 2.0.21 (and our
      # Gradle build) cannot parse. Force JDK 17/21 for the build.
            - name: Select JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Ensure Android SDK platform 35
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "android-35 already installed"
          else
            echo "android-35 missing; installing via sdkmanager"
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-35"
          fi

      - name: Build APK (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: virality-clipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
